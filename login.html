<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In - Stackly</title>
  <meta name="description" content="Sign in to your Stackly account and continue streaming."/>
  <link rel="stylesheet" href="assets/css/style.css"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;}
    body{margin:0;min-height:100vh;display:flex;flex-direction:column;}
    .auth-root{flex:1;display:grid;grid-template-columns:1fr 480px;min-height:100vh;}
    @media(max-width:800px){.auth-root{grid-template-columns:1fr;}.auth-visual{display:none!important;}}
    /* Visual side */
    .auth-visual{position:relative;overflow:hidden;}
    .auth-visual-bg{position:absolute;inset:0;background:url('assets/img/1.webp') center/cover no-repeat;}
    .auth-visual-overlay{position:absolute;inset:0;background:linear-gradient(135deg,rgba(10,10,15,0.82) 0%,rgba(124,58,237,0.3) 60%,rgba(10,10,15,0.7) 100%);}
    .auth-visual-content{position:absolute;bottom:0;left:0;right:0;padding:48px;z-index:2;}
    .auth-visual-cards{position:absolute;top:50%;left:50%;transform:translate(-50%,-58%);width:100%;display:flex;justify-content:center;gap:16px;z-index:1;}
    .auth-visual-card{width:130px;height:190px;border-radius:12px;background-size:cover;background-position:center;box-shadow:0 20px 60px rgba(0,0,0,0.5);transition:transform 0.4s ease;}
    .auth-visual-card:nth-child(1){transform:rotate(-8deg) translateY(20px);}
    .auth-visual-card:nth-child(2){transform:rotate(2deg) translateY(-10px);}
    .auth-visual-card:nth-child(3){transform:rotate(6deg) translateY(15px);}
    /* Form side */
    .auth-form-side{background:var(--clr-bg);display:flex;flex-direction:column;justify-content:center;padding:48px 52px;overflow-y:auto;}
    @media(max-width:600px){.auth-form-side{padding:32px 24px;}}
    .auth-logo{margin-bottom:40px;}
    .auth-title{font-size:2rem;font-weight:800;margin-bottom:8px;color:var(--clr-text);}
    .auth-subtitle{color:var(--clr-text-muted);margin-bottom:32px;font-size:0.95rem;}
    .social-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px;}
    .social-btn-new{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid var(--clr-border);border-radius:var(--radius-sm);color:var(--clr-text);font-size:0.88rem;font-weight:500;cursor:pointer;transition:var(--transition);}
    .social-btn-new:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.2);}
    .divider-line{display:flex;align-items:center;gap:12px;margin-bottom:24px;}
    .divider-line::before,.divider-line::after{content:'';flex:1;height:1px;background:var(--clr-border);}
    .divider-line span{color:var(--clr-text-muted);font-size:0.8rem;white-space:nowrap;}
    .field{margin-bottom:20px;}
    .field label{display:block;font-size:0.85rem;font-weight:600;color:var(--clr-text-muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.06em;}
    .field input{width:100%;padding:14px 16px;background:rgba(255,255,255,0.05);border:1px solid var(--clr-border);border-radius:var(--radius-sm);color:var(--clr-text);font-size:0.95rem;transition:var(--transition);outline:none;}
    .field input:focus{border-color:var(--clr-primary);background:rgba(124,58,237,0.07);}
    .field input::placeholder{color:rgba(255,255,255,0.25);}
    .field-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;}
    .field-row label{margin-bottom:0;}
    .forgot-link{font-size:0.82rem;color:var(--clr-primary2);text-decoration:none;}
    .forgot-link:hover{text-decoration:underline;}
    .pw-wrap{position:relative;}
    .pw-wrap input{padding-right:48px;}
    .pw-toggle{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--clr-text-muted);cursor:pointer;padding:4px;font-size:1rem;line-height:1;}
    .submit-btn{width:100%;padding:15px;background:linear-gradient(135deg,var(--clr-primary),var(--clr-primary2));border:none;border-radius:var(--radius-sm);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;margin-top:8px;margin-bottom:24px;transition:var(--transition);}
    .submit-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(124,58,237,0.4);}
    .auth-switch{text-align:center;color:var(--clr-text-muted);font-size:0.9rem;}
    .auth-switch a{color:var(--clr-primary2);font-weight:600;text-decoration:none;}
    .auth-switch a:hover{text-decoration:underline;}
    .remember-row{display:flex;align-items:center;gap:10px;margin-bottom:20px;justify-content:flex-start;}
    .remember-row input{accent-color:var(--clr-primary);width:16px;height:16px;cursor:pointer;}
    .remember-row label{font-size:0.85rem;color:var(--clr-text-muted);cursor:pointer;}
    .form-error{display:block;font-size:0.78rem;color:#f87171;margin-top:4px;min-height:18px;}
  </style>
</head>
<body>
<div class="auth-root">
  <!-- Visual Side -->
  <div class="auth-visual">
    <div class="auth-visual-bg"></div>
    <div class="auth-visual-overlay"></div>
    <div class="auth-visual-cards">
      <div class="auth-visual-card" style="background-image:url('assets/img/26.webp');"></div>
      <div class="auth-visual-card" style="background-image:url('assets/img/13.webp');"></div>
      <div class="auth-visual-card" style="background-image:url('assets/img/9.webp');"></div>
    </div>
    <div class="auth-visual-content">
      <span class="badge badge-primary" style="margin-bottom:14px;">🎬 STACKLY PREMIUM</span>
      <h2 style="margin-bottom:10px;font-size:1.8rem;">Your Entertainment.<br><span class="gradient-text">Unlimited.</span></h2>
      <p style="color:rgba(255,255,255,0.65);font-size:0.9rem;line-height:1.7;max-width:340px;">15,000+ titles · Zero ads · 4K Ultra HD · Watch on any device</p>
    </div>
  </div>

  <!-- Form Side -->
  <div class="auth-form-side">
    <div class="auth-logo">
      <a href="index.html"><img src="assets/img/stackly_logo.webp" style="height:72px;object-fit:contain;" alt="Stackly"/></a>
    </div>
    <a href="index.html" style="display:inline-flex;align-items:center;gap:6px;color:var(--clr-text-muted);font-size:0.88rem;text-decoration:none;margin-bottom:28px;transition:color 0.2s;" onmouseover="this.style.color='var(--clr-primary)'" onmouseout="this.style.color='var(--clr-text-muted)'"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg> Back to Home</a>
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Sign in to continue watching</p>

    <div class="social-row">
      <button class="social-btn-new" id="googleAuth" onclick="window.location.href='404.html'">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Google
      </button>
      <button class="social-btn-new" id="appleAuth" onclick="window.location.href='404.html'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
        Apple
      </button>
    </div>

    <div class="divider-line"><span>or sign in with email</span></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" name="email" placeholder="you@example.com" data-validate="required|email" data-err-required="Email is required." data-err-email="Enter a valid email."/>
        <span class="form-error" id="loginEmailError"></span>
      </div>
      <div class="field">
        <div class="field-row">
          <label for="loginPassword">Password</label>
          <a href="404.html" class="forgot-link">Forgot password?</a>
        </div>
        <div class="pw-wrap">
          <input type="password" id="loginPassword" name="password" placeholder="Your password" data-validate="required|min:6" data-err-required="Password is required." data-err-min="Minimum 6 characters."/>
          <button type="button" class="pw-toggle" id="toggleLoginPw" aria-label="Toggle password"><svg id="eyeLoginOn" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg><svg id="eyeLoginOff" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg></button>
        </div>
        <span class="form-error" id="loginPasswordError"></span>
      </div>
      <div class="remember-row">
        <input type="checkbox" id="rememberMe"/>
        <label for="rememberMe">Keep me signed in</label>
      </div>
      <button type="submit" class="submit-btn" id="loginSubmitBtn">Sign In to Stackly</button>
    </form>

    <p class="auth-switch">Don't have an account? <a href="signup.html">Create one free →</a></p>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="assets/js/validation.js"></script>
<script src="assets/js/script.js"></script>
<script>
  const toggleBtn = document.getElementById('toggleLoginPw');
  const pwInput = document.getElementById('loginPassword');
  if(toggleBtn && pwInput) {
    toggleBtn.addEventListener("click", () => {
      pwInput.type = pwInput.type === 'password' ? 'text' : 'password';
    });
  }
</script>
</body>
</html>
